        <div class="section">
            <h2>事件研究方法</h2>
            <p>事件研究（Event Study）是金融領域經典方法，用來分析特定事件對股價的影響：</p>
            <ul style="margin:16px 0 0 24px; line-height:1.9;">
                <li>事件前後的異常報酬（Abnormal Return）</li>
                <li>累積異常報酬（CAR）</li>
                <li>情緒指標與股價的關係</li>
            </ul>
        </div>
        
        <div class="section">
            <h2>R 實際輸出</h2>
            <p>事件前後累積異常報酬曲線：</p>
            
            <div style="background:#fff; border:3px solid var(--border); padding:20px; margin:20px 0; text-align:center;">

            </div>
        </div>
        
        <div class="section">
            <h2>常見錯誤</h2>
            <div class="warning">
                <strong>1. 事件日期定義不清</strong><br>
                公告日 vs 事件日容易混淆，需明確定義。
            </div>
            <div class="warning">
                <strong>2. 忽略市場模式</strong><br>
                必須扣除大盤影響，否則無法判斷是否為異常。
            </div>
